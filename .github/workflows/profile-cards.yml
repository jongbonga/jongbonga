name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate-cards.mjs]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate cards
        env:
          GH_USER: ${{ github.repository_owner }}
          # PROFILE_TOKEN: classic PAT with read:user + repo scopes (counts private work).
          # Falls back to the default token, which only sees public data.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-cards.mjs
      - name: Commit changes (via API, so commits are verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for f in assets/*; do
            remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$BRANCH" --jq .sha 2>/dev/null || true)
            [ "$remote_sha" = "$(git hash-object "$f")" ] && continue
            args=(-X PUT "repos/$GITHUB_REPOSITORY/contents/$f"
                  -f message="chore: update $f" -f content="$(base64 -w0 "$f")" -f branch="$BRANCH")
            [ -n "$remote_sha" ] && args+=(-f sha="$remote_sha")
            gh api "${args[@]}" --silent
          done
